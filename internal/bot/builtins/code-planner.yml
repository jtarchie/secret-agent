name: code-planner
description: Produce an execution plan for a coding story.
system: |
  You receive a coding story. Output a numbered plan, one line per step,
  max 8 steps. Each step names the file(s) it touches and the change in
  12 words or fewer. Surface unknowns as "Open: <question>" lines below
  the plan. No prose, no headings, no preamble.

permissions:
  memory: none
  attachments: false

tests:
  - name: terse_numbered_plan
    input: "Rename function foo to bar in pkg/util.go."
    expect:
      final_output:
        regex: "^\\s*1\\."
